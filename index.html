<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0f14" />
<title>نظام التحكم بالإنفرتر — INVERTER-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06090c;
    --surface:rgba(20,27,35,.55);
    --border:rgba(255,255,255,.08);
    --text:#f3f6f9;
    --text-dim:#9aa7b2;
    --text-faint:#5b6773;
    --amber:#ffb238;
    --amber-soft:rgba(255,178,56,.16);
    --amber-glow:rgba(255,178,56,.55);
    --teal:#33e5cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic',sans-serif;
    overflow:hidden;
    position:relative;
  }
  .mono{font-family:'JetBrains Mono',monospace}

  canvas#wave{
    position:fixed;inset:0;width:100%;height:100%;display:block;
  }

  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 50% at 50% 100%, rgba(6,9,12,.9) 0%, transparent 60%),
               radial-gradient(ellipse 90% 60% at 50% 0%, rgba(6,9,12,.6) 0%, transparent 55%);
  }

  .stage{
    position:relative;z-index:2;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }

  .top-id{
    position:fixed;top:26px;right:28px;left:28px;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
  }
  .top-brand{display:flex;align-items:center;gap:9px}
  .top-mark{width:26px;height:26px;color:var(--amber)}
  .top-mark svg{width:100%;height:100%}
  .top-name{font-size:12.5px;color:var(--text-dim);letter-spacing:.02em}
  .top-status{
    display:flex;align-items:center;gap:7px;color:var(--text-faint);font-size:11px;letter-spacing:.06em;
  }
  .top-status .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  .core{
    position:relative;
    width:150px;height:150px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:36px;
  }
  .core svg{width:44px;height:44px;color:var(--amber);position:relative;z-index:2;
    filter:drop-shadow(0 0 14px var(--amber-glow));}
  .ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(255,178,56,.22);
  }
  .ring.r1{animation:spin 22s linear infinite}
  .ring.r2{inset:20px;border-color:rgba(51,229,207,.18);animation:spin 16s linear infinite reverse}
  .ring.r3{inset:40px;border-style:dashed;border-color:rgba(255,178,56,.14);animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(255,178,56,.4);
    animation:pulse-out 2.8s ease-out infinite;
  }
  .pulse-ring.p2{animation-delay:1.4s}
  @keyframes pulse-out{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.25);opacity:0}}

  h1{
    font-size:clamp(24px,4vw,32px);
    font-weight:700;text-align:center;margin-bottom:8px;
    letter-spacing:-.01em;
  }
  .tagline{
    color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:38px;
    max-width:34ch;
  }
  .tagline .mono{color:var(--teal)}

  .btn-primary{
    display:inline-flex;align-items:center;gap:10px;
    padding:15px 32px;border-radius:100px;
    background:var(--amber);color:#1a1204;
    font-weight:600;font-size:15.5px;border:none;cursor:pointer;
    box-shadow:0 8px 30px -6px var(--amber-glow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 38px -6px var(--amber-glow)}
  .btn-primary:active{transform:translateY(0) scale(.98)}
  .btn-primary:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .btn-primary svg{width:16px;height:16px}

  .bottom-strip{
    position:fixed;bottom:22px;right:28px;left:28px;z-index:3;
    display:flex;justify-content:space-between;align-items:center;
    color:var(--text-faint);font-size:10.5px;letter-spacing:.05em;
  }

  @media (max-width:520px){
    .core{width:120px;height:120px;margin-bottom:28px}
    .core svg{width:36px;height:36px}
  }
  @media (prefers-reduced-motion:reduce){
    .ring,.pulse-ring,.top-status .dot{animation:none}
  }
</style>
</head>
<body>

<canvas id="wave"></canvas>
<div class="vignette"></div>

<div class="top-id">
  <div class="top-brand">
    <span class="top-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"></path></svg>
    </span>
    <span class="top-name mono">INVERTER-01</span>
  </div>
  <span class="top-status mono"><span class="dot"></span>LIVE</span>
</div>

<div class="stage">
  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring p2"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"></path></svg>
  </div>

  <h1>نظام التحكم بالإنفرتر</h1>
  <p class="tagline">تحكّم ومراقبة لحظية عبر اتصال <span class="mono">مشفّر</span></p>

  <a href="login.html" class="btn-primary">
    الدخول إلى لوحة التحكم
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  </a>
</div>

<div class="bottom-strip mono">
  <span>ESP32 · TLS</span>
  <span>وصول مُصرّح فقط</span>
</div>

<script>
(function(){
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawWave(t, amp, freq, speed, color, lineWidth, yOffset, glow){
    ctx.beginPath();
    const step = 6;
    for(let x = 0; x <= w; x += step){
      const y = yOffset + Math.sin((x * freq) + t * speed) * amp * (0.5 + 0.5*Math.sin(x*0.0025 + t*0.4));
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.stroke();
  }

  let t0 = 0;
  function frame(ts){
    t0 = ts / 1000;
    ctx.clearRect(0,0,w,h);
    const midY = h * 0.62;

    drawWave(t0, h*0.05, 0.006, 1.1, 'rgba(255,178,56,0.55)', 1.6, midY, 14);
    drawWave(t0+2, h*0.08, 0.004, 0.8, 'rgba(255,178,56,0.22)', 1.2, midY + h*0.06, 10);
    drawWave(t0+4, h*0.035, 0.008, 1.4, 'rgba(51,229,207,0.28)', 1, midY - h*0.05, 10);

    if(!reduced) requestAnimationFrame(frame);
  }

  if(reduced){
    frame(0);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
